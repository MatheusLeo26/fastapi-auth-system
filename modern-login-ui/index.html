<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login UI</title>
    <link rel="stylesheet" href="/modern/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper" id="loginWrapper">
            <!-- Left Side - Illustration -->
            <div class="illustration-side">
                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" class="characters-svg">
                    
                    <!-- Blue Shape (Right) -->
                    <g class="char-blue" transform="translate(260, 180)">
                        <rect x="0" y="0" width="90" height="130" rx="45" fill="#3B82F6"/>
                        <g class="eyes-open">
                            <circle cx="30" cy="45" r="9" fill="white"/>
                            <circle cx="30" cy="45" r="3.5" fill="#1e1e1e" class="pupil"/>
                            <circle cx="60" cy="45" r="9" fill="white"/>
                            <circle cx="60" cy="45" r="3.5" fill="#1e1e1e" class="pupil"/>
                        </g>
                        <g class="eyes-closed">
                            <path d="M 20 45 Q 30 38 40 45" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M 50 45 Q 60 38 70 45" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>
                    
                    <!-- Orange Semicircle (Left) -->
                    <g class="char-orange" transform="translate(40, 220)">
                        <path d="M 0 90 A 55 55 0 0 1 110 90 Z" fill="#F97316"/>
                        <g class="eyes-open">
                            <circle cx="40" cy="55" r="8" fill="white"/>
                            <circle cx="40" cy="55" r="3" fill="#1e1e1e" class="pupil"/>
                            <circle cx="70" cy="55" r="8" fill="white"/>
                            <circle cx="70" cy="55" r="3" fill="#1e1e1e" class="pupil"/>
                        </g>
                        <g class="eyes-closed">
                            <path d="M 31 55 Q 40 48 49 55" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M 61 55 Q 70 48 79 55" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Purple Rectangle (Center) -->
                    <g class="char-purple" transform="translate(140, 110)">
                        <rect x="0" y="0" width="110" height="200" rx="16" fill="#8B5CF6"/>
                        <g class="eyes-open">
                            <circle cx="35" cy="60" r="12" fill="white"/>
                            <circle cx="35" cy="60" r="5" fill="#1e1e1e" class="pupil"/>
                            <circle cx="75" cy="60" r="12" fill="white"/>
                            <circle cx="75" cy="60" r="5" fill="#1e1e1e" class="pupil"/>
                        </g>
                        <!-- Arms -->
                        <path class="arm-left" d="M -10 100 L -10 160" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" fill="none" />
                        <path class="arm-right" d="M 120 100 L 120 160" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" fill="none" />
                    </g>
                </svg>
            </div>

            <!-- Right Side - Form -->
            <div class="form-side">
                <div class="login-header">
                    <h2 id="form-title">Welcome back</h2>
                    <p id="form-subtitle">Please enter your details.</p>
                </div>
                
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="email">Username</label>
                        <input type="text" id="email" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group email-group" id="email-group" style="display: none;">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember for 30 days</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <div id="error-message" class="error-message"></div>
                    
                    <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
                    <button type="button" class="btn-secondary">
                        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Log in with Google
                    </button>
                </form>
                
                <p class="form-footer">
                    <span id="toggle-text">Don't have an account? <a href="#" id="toggle-mode-link">Sign up</a></span>
                </p>
            </div>
    </div>
    <script src="/modern/script.js"></script>
</body>
</html>
